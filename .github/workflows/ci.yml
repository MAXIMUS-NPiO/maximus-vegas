name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rental_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: c25_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rental_test -d c25_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgresql://rental_test:isolated_ci_only@127.0.0.1:5432/c25_ci
      RENTAL_PG_TEST_URL: postgresql://rental_test:isolated_ci_only@127.0.0.1:5432/c25_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Concurrent leaderboard review and retry
        run: node --test tests/leaderboard-locking-postgres.test.ts
      - name: Run npm run check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run check 2>&1 | tee artifacts/quality-check.log
          python3 -c 'import pathlib,re,sys; text=pathlib.Path("artifacts/quality-check.log").read_text(); bad=re.search(r"not supported in the Edge Runtime|node-module-in-edge-runtime|edge-dynamic-code-evaluation",text); print("Edge runtime compatibility: FAILED" if bad else "Edge runtime compatibility: passed"); sys.exit(1 if bad else 0)'
      - name: Quality check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-check
          path: artifacts/quality-check.log
      - name: Bracket and twenty-game best-N acceptance
        run: npm run acceptance:tournaments
      - run: python3 -m unittest discover -s server-agent -v
      - name: Admin HTTP acceptance (isolated database)
        run: node scripts/admin-http.mjs
      - name: Admin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-acceptance
          path: |
            artifacts/c33-http-report.json
            artifacts/c33-server.log
      - name: Install acceptance browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Studio browser acceptance
        run: node scripts/broadcasts-browser.mjs
      - name: Studio acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-acceptance
          path: |
            artifacts/c29-screens
            artifacts/c29-browser-report.json
            artifacts/c29-server.log
      - name: Community browser acceptance
        run: node scripts/community-browser.mjs
      - name: Community acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-acceptance
          path: |
            artifacts/c30-screens
            artifacts/c30-browser-report.json
            artifacts/c30-server.log

      - name: Player invitations and experience acceptance
        run: node scripts/players-browser.mjs
      - name: Player acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-acceptance
          path: |
            artifacts/c31-screens
            artifacts/c31-browser-report.json
            artifacts/c31-server.log
      - name: Complete platform HTTP and browser journeys
        run: node scripts/platform-acceptance.mjs
      - name: Platform acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-acceptance
          path: |
            artifacts/c31-platform-report.json
            artifacts/c31-platform-server.log
