name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rental_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: c25_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rental_test -d c25_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgresql://rental_test:isolated_ci_only@127.0.0.1:5432/c25_ci
      RENTAL_PG_TEST_URL: postgresql://rental_test:isolated_ci_only@127.0.0.1:5432/c25_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s server-agent -v
      - name: Install acceptance browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Studio browser acceptance
        run: node scripts/broadcasts-browser.mjs
      - name: Studio acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-acceptance
          path: |
            artifacts/c29-screens
            artifacts/c29-browser-report.json
            artifacts/c29-server.log
